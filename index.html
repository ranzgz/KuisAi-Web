<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genius AI Quiz - Ultimate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; color: white; overflow-x: hidden; }
        h1, h2, h3, .brand-font { font-family: 'Outfit', sans-serif; }
        
        /* Background Animasi */
        .bg-animated {
            background: radial-gradient(circle at 50% 50%, #1e1b4b, #020617);
            position: fixed; inset: 0; z-index: -2;
        }
        .blob {
            position: absolute; width: 500px; height: 500px; background: linear-gradient(180deg, rgba(79, 70, 229, 0.4) 0%, rgba(124, 58, 237, 0.2) 100%);
            border-radius: 50%; filter: blur(80px); z-index: -1; animation: float 10s infinite alternate;
        }
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(30px, -30px) scale(1.1); } }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .gradient-text { background: linear-gradient(to right, #22d3ee, #a78bfa, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-primary { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(124, 58, 237, 0.5); filter: brightness(1.1); }
        
        .hidden { display: none !important; }
        .animate-enter { animation: fadeInUp 0.5s ease-out forwards; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Loader */
        .loader-dots div { animation-timing-function: cubic-bezier(0, 1, 1, 0); }
        .loader-dots div:nth-child(1) { left: 8px; animation: loader-dots1 0.6s infinite; }
        .loader-dots div:nth-child(2) { left: 8px; animation: loader-dots2 0.6s infinite; }
        .loader-dots div:nth-child(3) { left: 32px; animation: loader-dots2 0.6s infinite; }
        .loader-dots div:nth-child(4) { left: 56px; animation: loader-dots3 0.6s infinite; }
        @keyframes loader-dots1 { 0% { transform: scale(0); } 100% { transform: scale(1); } }
        @keyframes loader-dots3 { 0% { transform: scale(1); } 100% { transform: scale(0); } }
        @keyframes loader-dots2 { 0% { transform: translate(0, 0); } 100% { transform: translate(24px, 0); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Background Elements -->
    <div class="bg-animated"></div>
    <div class="blob top-0 left-0"></div>
    <div class="blob bottom-0 right-0" style="background: linear-gradient(180deg, rgba(236, 72, 153, 0.3) 0%, rgba(239, 68, 68, 0.1) 100%); width:400px; height:400px; animation-delay: -5s;"></div>

    <!-- MAIN CONTAINER -->
    <div class="relative w-full max-w-md md:max-w-2xl min-h-[500px] perspective-1000">

        <!-- VIEW 1: PROFILE SETUP -->
        <div id="view-profile" class="glass-card rounded-3xl p-8 text-center animate-enter">
            <div class="w-24 h-24 mx-auto bg-gradient-to-br from-indigo-500 to-purple-500 rounded-full flex items-center justify-center mb-6 shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-user-astronaut text-4xl text-white"></i>
            </div>
            <h1 class="text-3xl font-bold mb-2 brand-font">Identitas Diri</h1>
            <p class="text-slate-400 mb-8 text-sm">Masukin nama keren lu biar masuk Leaderboard!</p>
            
            <input type="text" id="input-nama" placeholder="Nickname / Nama Panggilan" class="w-full bg-slate-800/50 border border-slate-700 rounded-xl p-4 text-center text-white focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition mb-4">
            
            <input type="password" id="input-api" placeholder="Paste API Key Gemini Disini" class="w-full bg-slate-800/50 border border-slate-700 rounded-xl p-3 text-center text-xs text-slate-300 focus:border-pink-500 focus:ring-1 focus:ring-pink-500 outline-none transition mb-6">

            <button onclick="simpanProfil()" class="btn-primary w-full py-4 rounded-xl font-bold text-lg tracking-wide">
                LET'S GO! 🚀
            </button>
        </div>

        <!-- VIEW 2: MAIN MENU -->
        <div id="view-menu" class="hidden glass-card rounded-3xl p-8 animate-enter">
            <div class="flex items-center justify-between mb-8">
                <div class="flex items-center gap-4">
                    <img id="avatar-user" src="" class="w-12 h-12 rounded-full border-2 border-indigo-400 bg-slate-800" alt="Avatar">
                    <div class="text-left">
                        <p class="text-xs text-slate-400">Welcome Back,</p>
                        <h2 id="nama-display" class="text-xl font-bold text-white leading-none">User</h2>
                    </div>
                </div>
                <button onclick="logout()" class="text-xs text-red-400 hover:text-red-300"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
            </div>

            <div class="space-y-4">
                <button onclick="bukaKuis()" class="group relative w-full h-32 rounded-2xl overflow-hidden cursor-pointer transition transform hover:scale-[1.02]">
                    <div class="absolute inset-0 bg-gradient-to-r from-blue-600 to-cyan-500 opacity-90"></div>
                    <div class="absolute inset-0 flex items-center justify-between px-8">
                        <div>
                            <h3 class="text-2xl font-bold text-white mb-1">Mulai Kuis</h3>
                            <p class="text-blue-100 text-sm">Tantang AI Gemini sekarang!</p>
                        </div>
                        <i class="fa-solid fa-gamepad text-5xl text-white/20 group-hover:rotate-12 transition duration-300"></i>
                    </div>
                </button>

                <button onclick="bukaLeaderboard()" class="group relative w-full h-24 rounded-2xl overflow-hidden cursor-pointer transition transform hover:scale-[1.02]">
                    <div class="absolute inset-0 bg-gradient-to-r from-purple-600 to-pink-500 opacity-90"></div>
                    <div class="absolute inset-0 flex items-center justify-between px-8">
                        <div>
                            <h3 class="text-xl font-bold text-white mb-1">Leaderboard</h3>
                            <p class="text-purple-100 text-sm">Lihat para sepuh</p>
                        </div>
                        <i class="fa-solid fa-trophy text-4xl text-white/20 group-hover:-rotate-12 transition duration-300"></i>
                    </div>
                </button>
            </div>
        </div>

        <!-- VIEW 3: SETUP KUIS -->
        <div id="view-setup" class="hidden glass-card rounded-3xl p-8 relative animate-enter">
            <button onclick="kembaliKeMenu()" class="absolute top-6 left-6 text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-left"></i></button>
            <h2 class="text-2xl font-bold text-center mb-8 brand-font gradient-text">Setting Dulu Gess</h2>

            <div class="space-y-6">
                <div>
                    <label class="block text-sm text-slate-400 mb-2 pl-1">Topik Bahasan</label>
                    <input type="text" id="input-topik" placeholder="Cth: Sejarah, Coding, Anime..." class="w-full bg-slate-900/50 border border-slate-700 rounded-xl p-4 text-white focus:border-cyan-500 outline-none">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm text-slate-400 mb-2 pl-1">Kesulitan</label>
                        <select id="input-level" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl p-4 text-white outline-none">
                            <option value="Mudah">Easy 😎</option>
                            <option value="Sedang" selected>Normal 🤔</option>
                            <option value="Sulit">Hard 🤯</option>
                            <option value="Ekstrem">Neraka 😈</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm text-slate-400 mb-2 pl-1">Jumlah Soal</label>
                        <input type="number" id="input-jumlah" value="5" min="3" max="10" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl p-4 text-white text-center outline-none">
                    </div>
                </div>

                <button onclick="startGenerasiSoal()" class="btn-primary w-full py-4 rounded-xl font-bold shadow-lg shadow-indigo-500/20 mt-4">
                    GENERATE & MAIN! <i class="fa-solid fa-bolt ml-2"></i>
                </button>
            </div>
        </div>

        <!-- VIEW 4: LOADING -->
        <div id="view-loading" class="hidden glass-card rounded-3xl p-12 text-center">
            <div class="loader-dots relative w-20 h-5 mx-auto mb-6">
                <div class="absolute top-0 w-3 h-3 rounded-full bg-white"></div>
                <div class="absolute top-0 w-3 h-3 rounded-full bg-white"></div>
                <div class="absolute top-0 w-3 h-3 rounded-full bg-white"></div>
                <div class="absolute top-0 w-3 h-3 rounded-full bg-white"></div>
            </div>
            <h3 class="text-xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 animate-pulse">
                AI Sedang Meracik Soal...
            </h3>
            <p id="loading-msg" class="text-slate-400 text-sm mt-3">Sabar yak, jangan direfresh!</p>
        </div>

        <!-- VIEW 5: GAMEPLAY -->
        <div id="view-game" class="hidden glass-card rounded-3xl p-6 md:p-8 animate-enter relative overflow-hidden">
            <!-- Progress Bar -->
            <div class="absolute top-0 left-0 h-1 bg-gradient-to-r from-blue-500 to-purple-500 transition-all duration-500" id="progress-bar" style="width: 0%"></div>

            <div class="flex justify-between items-center mb-6 mt-2">
                <span id="badge-soal" class="bg-slate-800 text-blue-300 px-3 py-1 rounded-lg text-xs font-bold border border-slate-700">Q 1/5</span>
                <span id="badge-score" class="bg-slate-800 text-yellow-300 px-3 py-1 rounded-lg text-xs font-bold border border-slate-700">PTS: 0</span>
            </div>

            <div class="min-h-[100px] flex items-center justify-center mb-6">
                <h2 id="text-pertanyaan" class="text-lg md:text-xl font-bold text-center leading-relaxed">
                    Loading Question...
                </h2>
            </div>

            <div id="container-opsi" class="space-y-3">
                <!-- Opsi generated by JS -->
            </div>

            <!-- Feedback Overlay -->
            <div id="feedback-overlay" class="hidden absolute inset-0 bg-slate-900/95 backdrop-blur-sm z-50 flex flex-col items-center justify-center p-8 text-center animate-enter">
                <div id="icon-feedback" class="text-6xl mb-4"></div>
                <h3 id="title-feedback" class="text-2xl font-bold mb-2"></h3>
                <p id="desc-feedback" class="text-slate-300 text-sm leading-relaxed mb-4"></p>
                <div class="loader-dots relative w-12 h-3 mx-auto opacity-50">
                    <div class="absolute bg-white w-2 h-2 rounded-full"></div>
                    <div class="absolute bg-white w-2 h-2 rounded-full"></div>
                    <div class="absolute bg-white w-2 h-2 rounded-full"></div>
                    <div class="absolute bg-white w-2 h-2 rounded-full"></div>
                </div>
            </div>
        </div>

        <!-- VIEW 6: RESULT -->
        <div id="view-result" class="hidden glass-card rounded-3xl p-8 text-center animate-enter">
            <div class="mb-6">
                <div class="w-32 h-32 mx-auto rounded-full flex items-center justify-center border-4 border-slate-700 relative">
                    <span id="final-emoji" class="text-6xl">🎉</span>
                    <div class="absolute -bottom-2 bg-slate-800 px-4 py-1 rounded-full text-xs text-slate-400 border border-slate-600">RANK</div>
                </div>
            </div>
            
            <h2 class="text-4xl font-black gradient-text mb-2" id="final-score">0</h2>
            <p id="final-msg" class="text-white font-medium mb-8">Pesan akhir disini</p>

            <div class="grid grid-cols-2 gap-4">
                <button onclick="bukaLeaderboard()" class="bg-slate-700 hover:bg-slate-600 text-white py-3 rounded-xl font-bold transition">
                    <i class="fa-solid fa-trophy mr-2"></i> Leaderboard
                </button>
                <button onclick="kembaliKeMenu()" class="bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-xl font-bold transition">
                    <i class="fa-solid fa-house mr-2"></i> Menu
                </button>
            </div>
        </div>

        <!-- VIEW 7: LEADERBOARD -->
        <div id="view-leaderboard" class="hidden glass-card rounded-3xl p-6 animate-enter h-[500px] flex flex-col">
            <div class="flex justify-between items-center mb-6">
                <button onclick="kembaliKeMenu()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-left"></i></button>
                <h2 class="text-xl font-bold brand-font">HALL OF FAME 🏆</h2>
                <div class="w-4"></div>
            </div>

            <div class="flex-1 overflow-y-auto pr-2 custom-scroll">
                <table class="w-full text-left border-collapse">
                    <thead class="text-xs text-slate-500 uppercase sticky top-0 bg-[#0f172a] z-10">
                        <tr>
                            <th class="py-3 pl-2">Rank</th>
                            <th class="py-3">Player</th>
                            <th class="py-3 text-right pr-2">Skor</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-leaderboard" class="text-sm">
                        <!-- Data JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Audio Assets -->
    <audio id="sfx-correct" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
    <audio id="sfx-wrong" src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3"></audio>
    <audio id="sfx-win" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>

    <script>
        // --- GLOBAL STATE ---
        const STATE = {
            apiKey: "",
            user: { nama: "", avatar: "" },
            config: { topik: "", level: "", jumlah: 5 },
            game: { soal: [], index: 0, score: 0, streak: 0 },
            voices: []
        };

        const synth = window.speechSynthesis;

        // --- INIT & UTILS ---
        window.onload = () => {
            // Load Voices
            synth.onvoiceschanged = () => { STATE.voices = synth.getVoices(); };
            
            // Cek LocalStorage
            const savedName = localStorage.getItem('quiz_username');
            const savedKey = localStorage.getItem('quiz_apikey');
            
            if(savedName && savedKey) {
                STATE.user.nama = savedName;
                STATE.apiKey = savedKey;
                generateAvatar(savedName);
                showView('view-menu');
                speak(`Halo ${savedName}, welcome back bestie! Siap main lagi?`);
            } else {
                showView('view-profile');
            }
        };

        function generateAvatar(name) {
            // DiceBear API untuk avatar robot lucu
            STATE.user.avatar = `https://api.dicebear.com/9.x/bottts-neutral/svg?seed=${name}`;
            document.getElementById('avatar-user').src = STATE.user.avatar;
            document.getElementById('nama-display').innerText = name;
        }

        function showView(id) {
            document.querySelectorAll('[id^="view-"]').forEach(el => el.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function speak(text, callback) {
            synth.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'id-ID';
            utter.rate = 1.1; // Sedikit lebih cepat biar gaul
            utter.pitch = 1.05; // Sedikit tinggi biar ceria

            // Cari suara Google ID kalau ada
            const indoVoice = STATE.voices.find(v => v.lang.includes('ID') || v.lang.includes('ind'));
            if(indoVoice) utter.voice = indoVoice;

            utter.onend = () => { if(callback) callback(); };
            synth.speak(utter);
        }

        // --- PROFILE SYSTEM ---
        function simpanProfil() {
            const nama = document.getElementById('input-nama').value.trim();
            const key = document.getElementById('input-api').value.trim();

            if(!nama || !key) {
                alert("Isi nama dan API Key dulu dong! 😅");
                return;
            }

            localStorage.setItem('quiz_username', nama);
            localStorage.setItem('quiz_apikey', key);
            
            STATE.user.nama = nama;
            STATE.apiKey = key;
            generateAvatar(nama);
            
            showView('view-menu');
            speak(`Yuhuu! Salam kenal ${nama}. Menu sudah siap nih.`);
        }

        function logout() {
            if(confirm("Yakin mau logout? Data skor tetep aman kok.")) {
                localStorage.removeItem('quiz_username');
                localStorage.removeItem('quiz_apikey');
                location.reload();
            }
        }

        // --- NAVIGATION ---
        function kembaliKeMenu() { showView('view-menu'); }
        function bukaKuis() { showView('view-setup'); speak("Oke, mau bahas topik apa kita hari ini?"); }
        
        function bukaLeaderboard() { 
            renderLeaderboard();
            showView('view-leaderboard');
        }

        // --- GAME LOGIC ---
        async function startGenerasiSoal() {
            STATE.config.topik = document.getElementById('input-topik').value || "Pengetahuan Umum";
            STATE.config.level = document.getElementById('input-level').value;
            STATE.config.jumlah = parseInt(document.getElementById('input-jumlah').value);

            showView('view-loading');
            
            const prompt = `
            Buatkan ${STATE.config.jumlah} soal kuis Pilihan Ganda tentang '${STATE.config.topik}' level '${STATE.config.level}'.
            Gaya bahasa: Gaul, santai, anak muda (Gunakan kata: Bestie, Gess, Gokil, dll).
            Output HARUS JSON Murni Array:
            [{"q": "Pertanyaan", "o": ["A. x", "B. y", "C. z", "D. w"], "a": "A", "exp": "Penjelasan singkat & lucu"}]
            `;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${STATE.apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                const raw = data.candidates[0].content.parts[0].text.replace(/```json|```/g, "").trim();
                STATE.game.soal = JSON.parse(raw);
                
                // Reset Game
                STATE.game.index = 0;
                STATE.game.score = 0;
                STATE.game.streak = 0;

                speak("Soal udah siap gess! Fokus ya!", () => renderSoal());

            } catch (e) {
                alert("Gagal konek ke AI. Cek API Key atau koneksi lu.");
                kembaliKeMenu();
            }
        }

        function renderSoal() {
            if (STATE.game.index >= STATE.game.soal.length) {
                finishGame();
                return;
            }

            showView('view-game');
            const current = STATE.game.soal[STATE.game.index];
            
            // UI Updates
            document.getElementById('badge-soal').innerText = `Q ${STATE.game.index + 1}/${STATE.game.soal.length}`;
            document.getElementById('badge-score').innerText = `PTS: ${STATE.game.score}`;
            document.getElementById('progress-bar').style.width = `${((STATE.game.index) / STATE.game.soal.length) * 100}%`;
            document.getElementById('text-pertanyaan').innerText = current.q;
            document.getElementById('feedback-overlay').classList.add('hidden');

            // Render Options
            const cont = document.getElementById('container-opsi');
            cont.innerHTML = "";
            current.o.forEach(opt => {
                const key = opt.charAt(0); // A,B,C,D
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 bg-slate-800/80 hover:bg-indigo-600/50 border border-slate-700 hover:border-indigo-400 rounded-xl transition text-sm md:text-base text-slate-200 font-medium group";
                btn.innerHTML = `<span class="font-bold text-indigo-400 group-hover:text-white mr-2">${key}.</span> ${opt.slice(2)}`;
                btn.onclick = () => checkAnswer(key, current.a, current.exp);
                cont.appendChild(btn);
            });

            speak(current.q);
        }

        function checkAnswer(userAns, correctAns, explanation) {
            const overlay = document.getElementById('feedback-overlay');
            const icon = document.getElementById('icon-feedback');
            const title = document.getElementById('title-feedback');
            const desc = document.getElementById('desc-feedback');
            
            overlay.classList.remove('hidden');

            let speakText = "";

            if(userAns === correctAns) {
                STATE.game.score += (10 + (STATE.game.streak * 2));
                STATE.game.streak++;
                
                document.getElementById('sfx-correct').play();
                icon.innerHTML = "🔥";
                title.innerText = "GOKIL BENER!";
                title.className = "text-2xl font-bold mb-2 text-green-400";
                speakText = `Mantap! Bener banget. ${explanation}`;
            } else {
                STATE.game.streak = 0;
                document.getElementById('sfx-wrong').play();
                icon.innerHTML = "💀";
                title.innerText = "YAH SALAH...";
                title.className = "text-2xl font-bold mb-2 text-red-400";
                speakText = `Salah bestie. Yang bener itu ${correctAns}. ${explanation}`;
            }

            desc.innerText = explanation;
            
            speak(speakText, () => {
                setTimeout(() => {
                    STATE.game.index++;
                    renderSoal();
                }, 1000);
            });
        }

        function finishGame() {
            showView('view-result');
            document.getElementById('sfx-win').play();
            document.getElementById('final-score').innerText = STATE.game.score;
            
            let msg = "";
            let emoji = "";
            if(STATE.game.score > 80) { msg = "Fix lu Jenius! 🧠"; emoji = "👑"; }
            else if(STATE.game.score > 40) { msg = "Not bad lah! 🔥"; emoji = "👏"; }
            else { msg = "Belajar lagi dek 🤣"; emoji = "🗿"; }

            document.getElementById('final-msg').innerText = msg;
            document.getElementById('final-emoji').innerText = emoji;

            saveToLeaderboard();
            speak(`Game kelar! Skor lu ${STATE.game.score}. ${msg}`);
        }

        // --- LEADERBOARD SYSTEM ---
        function saveToLeaderboard() {
            const entry = {
                name: STATE.user.nama,
                topic: STATE.config.topik,
                score: STATE.game.score,
                date: new Date().toLocaleDateString()
            };

            let lb = JSON.parse(localStorage.getItem('quiz_leaderboard') || "[]");
            lb.push(entry);
            lb.sort((a, b) => b.score - a.score); // Urut dari terbesar
            lb = lb.slice(0, 50); // Simpan top 50 aja
            
            localStorage.setItem('quiz_leaderboard', JSON.stringify(lb));
        }

        function renderLeaderboard() {
            const lb = JSON.parse(localStorage.getItem('quiz_leaderboard') || "[]");
            const tbody = document.getElementById('tbody-leaderboard');
            tbody.innerHTML = "";

            if(lb.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="text-center py-8 text-slate-500">Belum ada sepuh disini.</td></tr>`;
                return;
            }

            lb.forEach((item, index) => {
                let rankStyle = "text-slate-400";
                if(index === 0) rankStyle = "text-yellow-400 font-bold";
                if(index === 1) rankStyle = "text-slate-300 font-bold";
                if(index === 2) rankStyle = "text-amber-600 font-bold";

                const row = `
                    <tr class="border-b border-slate-800 hover:bg-slate-800/50 transition">
                        <td class="py-3 pl-2 ${rankStyle}">#${index + 1}</td>
                        <td class="py-3">
                            <div class="font-bold text-slate-200">${item.name}</div>
                            <div class="text-xs text-slate-500 truncate max-w-[120px]">${item.topic}</div>
                        </td>
                        <td class="py-3 text-right pr-2 font-mono text-indigo-400">${item.score}</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }
    </script>
</body>
</html>
